site_name: StructOut
site_description: Interactive JSON-Schema workbench for LLMs—design, validate and extract typed output with one-click client snippets
strict: true
site_url: https://ai.structout.dev          # update later

repo_name: seshragav/structout
repo_url: https://github.com/shortpage/structout
edit_uri: edit/main/docs/
copyright: © Sesh Ragavachari 2025-present

nav:
  - Introduction: index.md

  - Guides:
      - Installation: installation.md
      - Quick Start: quick-start.md
      - Extended Example: extended-example.md

  - Visual Designer:
      - Using the Designer: visualdesigner.md
      - Illustrations: visualdesigner_illustration.md

  - Multi-Provider Schema:
      - The Problem: llm-providers/theProblem.md
      - Solution: llm-providers/theSolution.md
      - Adapters:
          - OpenAI Adapter:       llm-providers/openai.md
          - Anthropic Adapter:    llm-providers/anthropic.md
          - Gemini Adapter:       llm-providers/gemini.md
          - Llama Adapter:        llm-providers/llama.md
          - Groq Adapter:         llm-providers/groq.md
          - Perplexity Adapter:   llm-providers/perplexity.md
      - Rule Processing: llm-providers/ruleProcessing.md
      - Implementation Summary: llm-providers/implementationFlow.md

  - LLM API Code Generation Guide:
      - Overview: providerSnippets/overview.md
      - Architecture: providerSnippets/architecture.md
      - How it Works: providerSnippets/howitworks.md
      - Core Components: providerSnippets/corecomponents.md
      - API Snippets: providerSnippets/providerAPISnippets.md
      - Code Structure: providerSnippets/generatedCodeStructure.md
      - Adding New Providers: providerSnippets/addNewProviders.md
      - Provider Configuration: providerSnippets/providerConfiguration.md
      - Runtime Features: providerSnippets/runtimeFeatures.md

  - Credentials Setup: credentials-setup.md

  - About:
      - License: about/license.md
      - Acknowledgement: about/pydantic.license.md
      - Author: about/author.md

extra:
  generator: false

theme:
  name: material
  custom_dir: ../overrides
  features:
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.sections
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-auto
        name: "Switch to light mode"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      accent: blue
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: "Switch to system preference"
  favicon: favicon.ico

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - extras/nav-tweaks.css      # smaller font on nested links
  - extras/badge-enhancements.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/algoliasearch@5.20.0/dist/lite/builds/browser.umd.js
  - https://cdn.jsdelivr.net/npm/instantsearch.js@4.77.3/dist/instantsearch.production.min.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tilde
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.extra:
      pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - sane_lists

plugins:
  - search
  - mkdocs-video:   # add the new one
      is_video: true        # use <video> instead of <iframe>
      video_controls: true  # show play bar (default)
  - mermaid2
