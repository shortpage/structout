site_name: StructOut
site_description: Interactive JSON-Schema workbench for LLMs—design, validate and extract typed, structured output from any provider with one-click client snippets
strict: true
site_url: https://ai.structout.dev          # update later

repo_name: seshragav/structout
repo_url: https://github.com/seshragav/structout
edit_uri: edit/main/docs/
copyright: © Sesh Ragavachari 2025 to present

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Quick Start: quick-start.md

  - LLM Providers:
      - llm-providers/index.md
      - llm-providers/openai.md
      - llm-providers/anthropic.md
      - llm-providers/gemini.md
      - llm-providers/groq.md
      - llm-providers/perplexity.md

  - Credentials Setup: credentials-setup.md

  - Examples:
      - examples/weather-agent.md
      - examples/bank-support.md

  - Editor Quick Runs: editor-quick-runs.md
  - License: license.md

extra:
  generator: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-auto
        name: "Switch to light mode"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: "Switch to system preference"
  features:
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.path
    - navigation.indexes
    - navigation.sections
    - navigation.tracking
    - toc.follow
  logo: img/logo-white.svg
  favicon: favicon.ico

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - extra/tweaks.css

extra_javascript:
  - /flarelytics/client.js
  - https://cdn.jsdelivr.net/npm/algoliasearch@5.20.0/dist/lite/builds/browser.umd.js
  - https://cdn.jsdelivr.net/npm/instantsearch.js@4.77.3/dist/instantsearch.production.min.js
  - /javascripts/algolia-search.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tilde
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.extra:
      pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - sane_lists


plugins:
  - search
