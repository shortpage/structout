name: CI

on:
  push:
    branches: [main]        # run on every push to main
  pull_request:             # and on every PR

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # 1️⃣  Check out the commit
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣  Install the exact pnpm version you pinned
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.3.0
          run_install: false        # we'll run pnpm install ourselves

      # 3️⃣  Install Node 20 and enable pnpm-store caching
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'      # auto-tracks Node 20 patch releases
          cache: pnpm

      # 4️⃣  Reproduce the dependency tree exactly
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5️⃣  Quality gates
      - name: Lint (eslint)
        run: pnpm lint --max-warnings 0

      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      # 6️⃣  Build the browser bundle
      - name: Build (web)
        run: pnpm build:web

      # 7️⃣  (Optional) Prune dev-only deps *after* the build succeeds
      #     Doing this last keeps @types/* available for tsc.
      - name: Prune production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: pnpm prune --prod

      # 8️⃣  Upload the build artefact from the Linux run
      - name: Upload build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
