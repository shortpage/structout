name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣  Check out the commit
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣  Install the exact pnpm version you pinned
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.3.0

      # 3️⃣  Install Node 20 and enable pnpm-store caching
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4️⃣  Reproduce the dependency tree exactly
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5️⃣  Quality gates
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

      # 6️⃣  Build the browser bundle
      - name: Build (web)
        run: pnpm build:web
